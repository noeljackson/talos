# Disable LVM backups as Talos rootfs is read-only, and ephemeral partition is not a safe place to store
# metadata backups.
#
# See https://github.com/siderolabs/talos/issues/3129
backup {
    backup = 0
    archive = 0
}

# Keep the host's own LVM off devices that belong to workloads. Talos scans
# block devices for volume groups; on a storage node that scan opened LINSTOR's
# DRBD devices, their dm-crypt layers (Linstor-Crypt-*) and the kubelet's loop
# devices over raw-block volumes. While the scan waited on a busy thin pool it
# held them open, so the kubelet could not unmap a stopped Pod's volume
# ("target is busy") and the Pod stayed Terminating. A device rejected here is
# never opened by LVM. Volume groups Talos manages sit on disks and partitions,
# which stay visible.
devices {
    global_filter = [ "r|^/dev/drbd|", "r|^/dev/loop|", "r|Linstor-Crypt-|" ]
}
