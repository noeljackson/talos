version = 3

disabled_plugins = [
    "io.containerd.differ.v1.erofs",
    "io.containerd.internal.v1.tracing",
    "io.containerd.snapshotter.v1.blockfile",
    "io.containerd.snapshotter.v1.erofs",
    "io.containerd.ttrpc.v1.otelttrpc",
    "io.containerd.tracing.processor.v1.otlp",
]

imports = [
    "/etc/cri/conf.d/cri.toml",
]

[debug]
level = "info"
format = "json"

# Flush each unpacked layer to disk (syncfs) before containerd commits its
# snapshot. Without this, a power loss shortly after a pull can leave
# zero-length files in snapshots that containerd's metadata records as fully
# unpacked, and an image already marked as pulled is not pulled again.
[plugins."io.containerd.service.v1.diff-service"]
  default = ["walking"]
  sync_fs = true
